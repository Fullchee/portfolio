name: Secrets scan

# Runs on every change, docs included: a token pasted into a doc is still a leak.
# Scans each new commit's patch, so a secret added in one commit and deleted in the next still fails.
on:
  push:
    branches: [main]
  # A full-history scan catches what range scans skip: force pushes and new default rules.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pre-commit runs detect-secrets, but `git commit --no-verify` skips it; CI can't be skipped.
  secrets:
    name: Secrets scan (Betterleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The range scan reads each commit's patch, so it needs history; the repo is small.
          fetch-depth: 0
      # Betterleaks 1 reads gitleaks' config and ignore files; v2 drops them, so stay on v1 until it is ported.
      - name: Install Betterleaks
        run: |
          curl -sSL -o betterleaks.tar.gz https://github.com/betterleaks/betterleaks/releases/download/v1.10.0/betterleaks_1.10.0_linux_x64.tar.gz
          echo "9d9ad503cd5d80d18a939352266c3fcca52f10da9b83cd5cfe646989b13940fe  betterleaks.tar.gz" | sha256sum -c -
          tar -xzf betterleaks.tar.gz -C "$RUNNER_TEMP" betterleaks
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$GITHUB_SHA"
          else
            # Schedule, manual run, or a force push whose old head is gone.
            range=""
          fi
          # A rule or allowlist change can find or hide old secrets, so it rescans all history.
          if [ -n "$range" ] && [ -n "$(git diff --name-only "$range" -- .gitleaks.toml .github/workflows/secrets.yml)" ]; then
            range=""
          fi
          echo "Scanning ${range:-all history}"
          "$RUNNER_TEMP/betterleaks" git --redact --no-banner -c .gitleaks.toml ${range:+--log-opts="$range"} .
