name: CI

# Docs-only changes skip CI: nothing ships from them, and secrets.yml still scans them.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        id: node
        with:
          node-version-file: package.json

      - uses: oven-sh/setup-bun@v2

      # Restoring node_modules whole skips resolving and linking every package.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('bun.lock') }}

      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # Storybook's Vitest project runs the stories in headless Chromium.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium

      # Each check runs even when an earlier one fails, so one run shows every failure.
      - run: bun run lint
        if: ${{ !cancelled() }}
      - run: bun run typecheck
        if: ${{ !cancelled() }}
      - run: bun run test
        if: ${{ !cancelled() }}
      - run: bun run fallow
        if: ${{ !cancelled() }}
      - run: bun run build
        if: ${{ !cancelled() }}
