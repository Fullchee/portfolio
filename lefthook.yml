#   https://lefthook.dev/configuration/
pre-commit:
  commands:
    oxlint-fmt:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx}"
      run: bunx oxfmt {staged_files} && bunx oxlint {staged_files}
      stage_fixed: true
    shadcn-lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: bunx oxlint --import-plugin . {staged_files}
    type-check:
      glob: "{.storybook,app,components,lib}/**/*.{ts,tsx}"
      run: bun run typecheck
    fallow-recommend:
      run: FALLOW_UPDATE_CHECK=off bunx fallow audit --changed-since HEAD
conventional-commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
