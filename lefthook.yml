#   https://lefthook.dev/configuration/
pre-commit:
  commands:
    # Formats the staged files and stages the result, so a commit never fails on style alone.
    format:
      glob: "*.{js,cjs,mjs,jsx,ts,tsx,json,jsonc,md,yml,yaml,css,toml}"
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    shfmt:
      glob: "*.sh"
      run: shfmt --write {staged_files}
      stage_fixed: true
    # `--no-verify` skips this, so .github/workflows/secrets.yml scans every push to main too.
    detect-secrets:
      run: uvx --from detect-secrets==1.5.0 detect-secrets-hook --baseline .secrets.baseline {staged_files} # pragma: allowlist secret
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

# Lints only the pushed files for speed; CI lints the whole repo.
pre-push:
  commands:
    # Type-aware with JS plugins, so it runs here rather than on every commit.
    oxlint:
      glob: "*.{js,cjs,mjs,jsx,ts,tsx}"
      run: bunx oxlint --deny-warnings {push_files}
    stylelint:
      glob: "*.css"
      run: bunx stylelint --allow-empty-input {push_files}
    # Fallow on the files changed since origin/main; CI runs it on the whole repo.
    fallow:
      glob: "*.{js,cjs,mjs,jsx,ts,tsx}"
      run: bunx fallow --quiet --fail-on-issues --changed-since origin/main --only dead-code,dupes

# Another session may have added a dependency; keep node_modules in step with bun.lock.
post-merge:
  commands:
    install:
      run: scripts/install-if-lock-changed.sh

post-rewrite:
  commands:
    install:
      run: scripts/install-if-lock-changed.sh

post-checkout:
  commands:
    install:
      # Skip with `LEFTHOOK=0 git worktree add …` for a docs or CI-only worktree.
      run: scripts/install-if-lock-changed.sh
