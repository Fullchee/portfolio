#   https://lefthook.dev/configuration/
pre-commit:
  commands:
    oxlint-fmt:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx}"
      run: pnpm dlx oxfmt {staged_files} && pnpm dlx oxlint {staged_files}
      stage_fixed: true
    type-check:
      glob: "{.storybook,app,components,lib}/**/*.{ts,tsx}"
      run: pnpm run typecheck
    fallow-recommend:
      run: npx fallow recommend
